<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Viora AI Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#20242c;background:#f7f8fa}button,input{font:inherit}button{cursor:pointer;border:0;background:none}.app{height:100vh;display:grid;grid-template-columns:360px 1fr;grid-template-rows:58px 1fr}.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;border-bottom:1px solid #e6e8ed}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#5b5df0,#35c7c4);box-shadow:0 5px 15px #6164e44d}.status{font-size:12px;color:#6f7685}.chat{background:#fff;border-right:1px solid #e6e8ed;display:flex;flex-direction:column;min-height:0}.chathead{padding:20px 22px 12px}.chathead h2{margin:0 0 10px;font-size:20px}.chatbody{padding:0 22px;overflow:auto;flex:1}.bubble{padding:12px 0;border-bottom:1px solid #f0f1f4;font-size:14px;line-height:1.65}.bubble .tag{font-size:11px;color:#8a91a0;margin-bottom:5px}.bubble.system{color:#5f6674}.composer{margin:14px 18px;border:1px solid #e0e3ea;border-radius:14px;background:#fff;box-shadow:0 8px 28px #30364a12}.composer textarea{width:100%;border:0;resize:none;outline:0;padding:14px;background:transparent;height:70px}.composerfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;color:#8b91a0;font-size:12px}.send{background:#222936;color:#fff;border-radius:8px;padding:7px 13px}.workspace{min-width:0;display:grid;grid-template-rows:48% 52%;background:#f7f8fa}.upper{display:grid;grid-template-columns:52% 48%;min-height:0}.assets,.preview{background:#fff;border-bottom:1px solid #e6e8ed}.assets{padding:16px 18px;overflow:auto}.tabs{display:flex;gap:20px;font-size:14px;color:#858c99;border-bottom:1px solid #eef0f3;margin-bottom:12px}.tabs b{color:#20242c;border-bottom:2px solid #5b5df0;padding-bottom:9px}.search{border:1px solid #e0e3ea;border-radius:8px;padding:9px 11px;width:100%;outline:0}.assetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.asset{border:1px solid #e6e8ed;border-radius:9px;overflow:hidden;background:#fafbfc}.thumb{height:78px;background:linear-gradient(135deg,#c8d7e6,#7799ad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}.asset span{display:block;padding:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{padding:16px;display:flex;flex-direction:column}.preview h3{margin:0 0 12px;font-size:16px}.screen{flex:1;min-height:0;border-radius:8px;background:linear-gradient(145deg,#c9d8df,#78919c 55%,#d7e7e8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:inset 0 0 0 1px #ffffff66}.controls{display:flex;gap:12px;align-items:center;padding-top:12px;color:#6e7684}.play{width:34px;height:34px;border-radius:50%;background:#242b38;color:#fff}.timeline{background:#fff;min-height:0;display:grid;grid-template-rows:52px 1fr}.toolbar{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #e6e8ed;color:#788090}.toolbar button{padding:7px 10px;border:1px solid #e1e4ea;border-radius:7px;color:#4f5664}.toolbar .primary{background:#5b5df0;color:#fff;border-color:#5b5df0}.tracks{display:grid;grid-template-columns:130px 1fr;min-height:0;overflow:auto}.tracklabels{border-right:1px solid #e6e8ed;background:#fafbfc}.tracklabel{height:86px;border-bottom:1px solid #eef0f3;padding:16px 14px;font-size:12px;font-weight:600}.tracklabel small{display:block;color:#7b8392;margin-top:6px}.lane{position:relative;background:repeating-linear-gradient(90deg,#fff 0,#fff 119px,#eef0f4 120px);border-bottom:1px solid #eef0f3;height:86px;padding:12px}.clip{height:60px;min-width:120px;display:inline-flex;flex-direction:column;justify-content:center;padding:8px 12px;margin-right:5px;border-radius:7px;color:#fff;background:linear-gradient(135deg,#5773ef,#758df8);font-size:12px;box-shadow:0 2px 6px #536be533}.clip.audio{background:linear-gradient(135deg,#47a96e,#75c884)}.empty{color:#9aa1ad;font-size:12px;padding:14px}.toast{position:fixed;right:20px;bottom:20px;padding:10px 14px;border-radius:8px;background:#202630;color:#fff;font-size:12px;display:none}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="mark"></div><span>Viora AI Studio</span></div><div class="status">SRK 已连接 · 本地优先 · EVA 就绪</div></header>
<aside class="chat"><div class="chathead"><h2>EVA 导演</h2><div class="status">用文字控制整个视频</div></div><div class="chatbody" id="chat"><div class="bubble"><div class="tag">EVA · 已准备</div>告诉我你想完成的视频任务，我会先生成计划，再调用 Viora 时间线。</div><div class="bubble system">工作区已连接。所有编辑会记录到本地项目事件日志。</div></div><div class="composer"><textarea id="prompt" placeholder="例如：导入素材，筛选高光，组成 30 秒预览…"></textarea><div class="composerfoot"><span>自动化：已开启</span><button class="send" id="send">发送</button></div></div></aside>
<section class="workspace"><div class="upper"><div class="assets"><div class="tabs"><b>我的素材</b><span>资源库</span><span>文稿</span></div><input class="search" id="search" placeholder="搜索素材"/><button id="import" style="margin-top:10px;padding:8px 12px;border:1px solid #e0e3ea;border-radius:7px;color:#4f5664">导入本地素材</button><div class="assetgrid" id="assetgrid"><div class="asset"><div class="thumb">＋</div><span>导入本地素材</span></div></div></div><div class="preview"><h3>预览</h3><div class="screen" id="screen">创建项目并导入素材后预览</div><div class="controls"><button class="play" id="play">▶</button><span id="timecode">00:00.00</span><span style="margin-left:auto">画布 1920 × 1080</span></div></div></div><div class="timeline"><div class="toolbar"><button id="newProject">＋ 项目</button><button id="refresh">刷新</button><button id="check">检查冲突</button><button id="addClip">添加到时间线</button><button class="primary" id="export">生成导出计划</button><span style="margin-left:auto">时间线 · v1</span></div><div class="tracks"><div class="tracklabels"><div class="tracklabel">V1<small>视频 1</small></div><div class="tracklabel">A1<small>原声音频</small></div></div><div><div class="lane" id="vlane"><div class="empty">时间线为空</div></div><div class="lane"><div class="empty">等待音频轨道</div></div></div></div></div></section></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), state={projectPath:'.viora',assets:[],clips:[]}; const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}; const call=(name,args={})=>fetch('/api/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,projectPath:state.projectPath,...args})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'操作失败');return x});
function message(text,tag='EVA'){const d=document.createElement('div');d.className='bubble';d.innerHTML=`<div class="tag">${tag}</div>${text}`;$('chat').appendChild(d);$('chat').scrollTop=99999}
async function refresh(){const p=await call('project.inspect');state.assets=p.assets||[];state.clips=p.timeline?.tracks?.[0]?.clips||[];$('assetgrid').innerHTML='<div class="asset"><div class="thumb">＋</div><span>导入本地素材</span></div>'+state.assets.map(a=>`<div class="asset"><div class="thumb">▣</div><span title="${a.path}">${a.id}</span></div>`).join('');$('vlane').innerHTML=state.clips.length?state.clips.map(c=>`<div class="clip">${c.assetId}<small>${c.duration} ms</small></div>`).join(''):'<div class="empty">时间线为空</div>';}
$('newProject').onclick=async()=>{try{await call('project.create');await refresh();toast('项目已打开');message('项目已打开，等待导入素材。')}catch(e){toast(e.message)}};$('refresh').onclick=()=>refresh().catch(e=>toast(e.message));$('export').onclick=async()=>{try{const x=await call('render.export',{outputPath:state.projectPath+'/renders/viora-preview.mp4'});toast('导出计划已生成');message(`导出计划已生成，Hash：${x.planHash}`,'SRK')}catch(e){toast(e.message)}};$('send').onclick=async()=>{const v=$('prompt').value.trim();if(!v)return;message(v,'你');$('prompt').value='';message('我会把任务拆解为可审计的 SRK 命令。当前可从项目、素材、时间线和导出计划开始。');};refresh().catch(()=>{});
$('search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#assetgrid .asset').forEach((el,i)=>{if(i===0)return;el.style.display=el.textContent.toLowerCase().includes(q)?'':'none'})});
$('assetgrid').addEventListener('click',e=>{const card=e.target.closest('.asset');if(!card||card===e.currentTarget.firstElementChild)return;document.querySelectorAll('.asset').forEach(x=>x.style.outline='');card.style.outline='2px solid #5b5df0';const a=state.assets.find(x=>card.textContent.includes(x.id));if(a){$('screen').textContent='已选择素材：'+a.id;message('预览已切换到 '+a.id,'预览')}});
$('vlane').addEventListener('click',e=>{const clip=e.target.closest('.clip');if(!clip)return;document.querySelectorAll('.clip').forEach(x=>x.style.outline='');clip.style.outline='2px solid #202936';$('screen').textContent='时间线片段预览';toast('已选择时间线片段')});
$('play').onclick=()=>{const b=$('play');b.dataset.playing=b.dataset.playing==='1'?'0':'1';b.textContent=b.dataset.playing==='1'?'Ⅱ':'▶';toast(b.dataset.playing==='1'?'预览播放中':'预览已暂停')};
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});</script></body></html>
